<!DOCTYPE html>

<head>
  <meta charset="utf-8">

  <title>Booking | Rent-a-Tech</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- ===== NAVBAR (same as every page) ===== -->
  <nav class="navbar">
    <a class="logo" href="index.html"><img src="images/logo.svg" alt="Rent-a-Tech logo"></a>
    <a href="services.html">Services</a>

    <a href="review.html">Review</a>
    <a href="help.html">Help</a>
  </nav>

  <!-- ===== BOOKING FORM ===== -->
  <main class="page">
    <h1>Book a Tech</h1>
    <p class="page-intro">Tell us what you need and pick a day.</p>

    <!-- action="#" means nothing is sent anywhere yet. See the note at the bottom. -->
    <form class="form" id="booking-form" action="#" method="post">

      <!-- Service dropdown. Rename the options to match your real services. -->
      <label for="service">Service</label>
      <select id="service" name="service" required>
        <option value="" disabled selected>Choose a service</option>
        <option value="service-1">Service 1</option>
        <option value="service-2">Service 2</option>
        <option value="service-3">Service 3</option>
        <option value="service-4">Service 4</option>
        <option value="service-5">Service 5</option>
        <option value="service-6">Service 6</option>
      </select>

      <!-- Description box where the customer explains the issue -->
      <label for="description">Describe the issue</label>
      <textarea id="description" name="description" rows="5" placeholder="Tell us what's going on, what device it is, and anything you've already tried." required></textarea>

      <!-- Date picker. Browsers show a built-in calendar for type="date". -->
      <label for="date">Preferred date</label>
      <input type="date" id="date" name="date" required>

      <button type="submit" class="signup-btn">Request booking</button>

      <!-- Shown after a successful submit -->
      <p class="form-message" id="message" hidden>Thanks! Your booking request was received.</p>
    </form>
  </main>

  <!-- ===== FOOTER (same as every page) ===== -->
    <footer class="footer">
    <a class="footer-logo" href="index.html"><img src="images/logo.svg" alt="Rent-a-Tech logo"></a>

    <div class="footer-contact">
      <h2>Contact us</h2>
      <p>Email: <a href="mailto:hello@yourdomain.com">hello@yourdomain.com</a></p>
      <p>Phone: <a href="tel:+13345550123">(334) 555-0123</a></p>
      <p>Auburn, AL</p>
    </div>

    <!-- Replace each # with your real social media page address -->
    <div class="footer-social">
      <a href="#">Instagram</a>
      <a href="#">Facebook</a>
      <a href="#">TikTok</a>
    </div>
  </footer>

  

</body>
</html>
