<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | Rent-a-Tech</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- ===== NAVBAR (same as every page) ===== -->
  <nav class="navbar">
    <a class="logo" href="index.html"><img src="images/logo.svg" alt="Rent-a-Tech logo"></a>
    <a href="services.html">Services</a>
    <a href="booking.html">Booking</a>
    <a href="guide.html">Guide</a>
    <a href="map.html">Map</a>
    <a href="review.html">Review</a>
    <a href="help.html">Help</a>
  </nav>

  <!-- ===== SIGN UP FORM ===== -->
  <main class="page">
    <h1>Sign up</h1>
    <p class="page-intro">Create your account in a minute.</p>

    <!-- "required" makes the browser block the form until the field is filled in.
         action="#" means nothing is sent anywhere yet. See the note at the bottom. -->
    <form class="form" id="signup-form" action="#" method="post">

      <label for="first">First name</label>
      <input type="text" id="first" name="first_name" autocomplete="given-name" required>

      <label for="last">Last name</label>
      <input type="text" id="last" name="last_name" autocomplete="family-name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <!-- pattern allows exactly 5 digits (US ZIP code) -->
      <label for="zip">ZIP code</label>
      <input type="text" id="zip" name="zip" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="postal-code" required>

      <!-- Terms and conditions checkbox. Change href to your terms page when you make one. -->
      <div class="check">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I accept the <a href="#">terms and conditions</a></label>
      </div>

      <button type="submit" class="signup-btn">Create account</button>

      <!-- Shown after a successful submit -->
      <p class="form-message" id="message" hidden>Thanks for signing up!</p>
    </form>
  </main>

  <!-- ===== FOOTER (same as every page) ===== -->
    <footer class="footer">
    <a class="footer-logo" href="index.html"><img src="images/logo.svg" alt="Rent-a-Tech logo"></a>

    <div class="footer-contact">
      <h2>Contact us</h2>
      <p>Email: <a href="mailto:hello@yourdomain.com">hello@yourdomain.com</a></p>
      <p>Phone: <a href="tel:+13345550123">(334) 555-0123</a></p>
      <p>Auburn, AL</p>
    </div>

    <!-- Replace each # with your real social media page address -->
    <div class="footer-social">
      <a href="#">Instagram</a>
      <a href="#">Facebook</a>
      <a href="#">TikTok</a>
    </div>
  </footer>



</body>
</html>
